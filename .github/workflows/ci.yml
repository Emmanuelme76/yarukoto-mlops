name: Yarukoto MLOps CI/CD

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  test-and-validate:
    name: Entrenamiento de Prueba y Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generar datos sintéticos y entrenar modelos
        run: |
          python src/generate_data.py
          python src/train.py
          python src/monitor.py

      - name: Ejecutar pruebas unitarias con Pytest
        run: |
          pytest -v

  build-and-deploy:
    name: Validar Build Docker y Despliegue Continuo
    runs-on: ubuntu-latest
    needs: test-and-validate

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker de Yarukoto Web
        run: |
          docker build -t yarukoto-mlops:ci-test .

      - name: Disparar Deploy Hook en la nube (solo rama main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Disparando despliegue automático en la nube..."
            curl -fsSL -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "RENDER_DEPLOY_HOOK no configurado aún. Saltando webhook."
          fi