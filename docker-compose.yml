services:
  yarukoto-web:
    build: .
    container_name: yarukoto-web
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/shared_data/mlflow.db
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./models:/app/models
      - shared_mlflow:/app/shared_data
    command: >
      sh -c "mkdir -p /app/shared_data &&
             if [ ! -f /app/shared_data/mlflow.db ]; then
               python src/generate_data.py &&
               python src/train.py &&
               python src/monitor.py;
             fi &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"

  mlflow:
    build: .
    container_name: yarukoto-mlflow
    ports:
      - "5000:5000"
    volumes:
      - shared_mlflow:/app/shared_data
    command: >
      mlflow ui
      --backend-store-uri sqlite:////app/shared_data/mlflow.db
      --default-artifact-root /app/shared_data/mlruns
      --host 0.0.0.0
      --port 5000
    depends_on:
      - yarukoto-web

  airflow:
    image: apache/airflow:2.10.3-python3.11
    container_name: yarukoto-airflow
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=yarukoto_secret_key_2026
      - AIRFLOW__WEBSERVER__WORKERS=1
      - AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL=0
      - AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT=300
      - AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT=300
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - YARUKOTO_PROJECT_ROOT=/opt/airflow/project
      - YARUKOTO_API_URL=http://yarukoto-web:8000/api/models/reload
      - MLFLOW_TRACKING_URI=sqlite:////opt/airflow/shared_data/mlflow.db
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
      - shared_mlflow:/opt/airflow/shared_data
    command: >
      bash -c "rm -f /opt/airflow/airflow-webserver.pid &&
               pip install --no-cache-dir pandas scikit-learn mlflow evidently joblib &&
               airflow standalone"
    depends_on:
      - yarukoto-web

volumes:
  shared_mlflow:
